name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (vX.Y.Z)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate release version
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Use a stable vX.Y.Z tag matching package.json version.');
          }
          NODE

      - uses: pnpm/action-setup@v4
        with:
          version: '12.8.1'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # The build script runs TypeScript checking before Vite.
      - name: Build
        run: pnpm build

      - name: Package plugin
        run: |
          test -f dist/index.html
          zip -r "logseq-better-graph-${RELEASE_TAG}.zip" package.json logo.svg LICENSE dist
          unzip -t "logseq-better-graph-${RELEASE_TAG}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "logseq-better-graph-${RELEASE_TAG}.zip" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
